[package]
name = "clearing-engine"
version = "0.1.0"
edition = "2021"
description = "Arbitrum Stylus Clearing Engine for ClearSwap DEX"

[dependencies]
stylus-sdk = "0.8.4"
alloy-primitives = "=0.8.20"
alloy-sol-types = "=0.8.20"
mini-alloc = "0.4.2"

[dev-dependencies]
tokio = { version = "1.12.0", features = ["full"] }

[features]
export-abi = ["stylus-sdk/export-abi"]

[lib]
crate-type = ["lib", "cdylib"]

[profile.release]
codegen-units = 1
opt-level = "s"
lto = true
panic = "abort"
